services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: feaststore
      POSTGRES_PASSWORD: feaststore
      POSTGRES_DB: feaststore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feaststore"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  serving:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FEASTSTORE_OFFLINE_DSN: postgresql+psycopg://feaststore:feaststore@postgres:5432/feaststore
      FEASTSTORE_ONLINE_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

volumes:
  pgdata:
